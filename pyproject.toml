[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "DeepAgents learning examples for deep research agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "deepagents==0.5.7",
    "fastapi>=0.100.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "markdown>=3.5",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "tavily-python==0.7.24",
    "tiktoken>=0.6.0",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
    # --- 自研 RAG (app/rag, 替代外部 RAGFlow 服务) ---
    "sentence-transformers>=3.0.0,<6.0.0",  # 本地中文向量模型(BGE);不装则自动降级为 hash 离线向量
    "jieba>=0.42.1",                        # 中文分词,BM25 与词面重排依赖
    # "faiss-cpu>=1.7.4",                   # 可选:装了则加速向量检索,不装走 numpy 全量点积(精确)
    # --- 旧 RAGFlow 集成(已下线,保留仅作回滚参考) ---
    # "ragflow-sdk>=0.1.0",                 # 新链路不再依赖,app/ragflow 已不在 Agent 装配中
]

[tool.uv]
package = false
